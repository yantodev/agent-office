name: Agent Office CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  GH_TOKEN: ${{ github.token }}
  ELECTRON_DISABLE_GPU: 1

jobs:
  validate:
    name: Validate / ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          # Aktifkan kembali setelah runner Windows self-hosted tersedia.
          # - windows
          # Aktifkan kembali setelah runner macOS self-hosted tersedia.
          # - macos
    # Self-hosted runner wajib memiliki label "self-hosted" dan label OS yang sesuai.
    runs-on: [self-hosted, "${{ matrix.platform }}"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential python3 gh libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 xvfb

      - name: Install GitHub CLI on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            if ! command -v brew >/dev/null 2>&1; then
              echo "Homebrew is required to install GitHub CLI on macOS"
              exit 1
            fi
            brew install gh
          fi
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install GitHub CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id GitHub.cli --exact --source winget --accept-source-agreements --accept-package-agreements
            } elseif (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install gh --yes --no-progress
            } else {
              throw 'winget atau Chocolatey diperlukan untuk menginstall GitHub CLI di Windows'
            }
          }
          $ghPath = Join-Path $env:ProgramFiles 'GitHub CLI'
          if (Test-Path $ghPath) { $ghPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - run: npm ci
      - name: Rebuild native modules for the CI Node runtime
        run: npm run web:rebuild-native
      - run: npm run typecheck
      - run: npm run smoke:unit
      - run: npm run smoke:web
      - run: npm run smoke:github
      - run: npm run build
      - run: npm run smoke:native
      - run: npm run smoke:main
      - run: npm run smoke:migration

  package:
    name: Package / ${{ matrix.name }}
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage
            platform: linux
            command: npm run dist:linux
            artifact: agent-office-linux
            path: dist/*.AppImage
          # Aktifkan kembali setelah runner Windows self-hosted tersedia.
          # - name: Windows NSIS
          #   platform: windows
          #   command: npm run dist:win
          #   artifact: agent-office-windows
          #   path: dist/*.exe
          # Aktifkan kembali setelah runner macOS self-hosted tersedia.
          # - name: macOS DMG
          #   platform: macos
          #   command: npm run dist:mac
          #   artifact: agent-office-macos
          #   path: dist/*.dmg
    # Self-hosted runner wajib memiliki label "self-hosted" dan label OS yang sesuai.
    runs-on: [self-hosted, "${{ matrix.platform }}"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential python3 gh libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 xvfb

      - run: npm ci
      - name: Build installer
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
