name: Agent Office CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  validate:
    name: Validate / ${{ matrix.platform }}
    fail-fast: false
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [linux, windows, macos]
    # Self-hosted runner wajib memiliki label "self-hosted" dan label OS yang sesuai.
    runs-on: [self-hosted, "${{ matrix.platform }}"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential python3

      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke:unit
      - run: npm run smoke:native
      - run: npm run smoke:main
      - run: npm run smoke:migration
      - run: npm run build

  package:
    name: Package / ${{ matrix.name }}
    needs: validate
    fail-fast: false
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: Linux AppImage
            platform: linux
            command: npm run dist:linux
            artifact: agent-office-linux
            path: dist/*.AppImage
          - name: Windows NSIS
            platform: windows
            command: npm run dist:win
            artifact: agent-office-windows
            path: dist/*.exe
          - name: macOS DMG
            platform: macos
            command: npm run dist:mac
            artifact: agent-office-macos
            path: dist/*.dmg
    # Self-hosted runner wajib memiliki label "self-hosted" dan label OS yang sesuai.
    runs-on: [self-hosted, "${{ matrix.platform }}"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential python3

      - run: npm ci
      - name: Build installer
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
