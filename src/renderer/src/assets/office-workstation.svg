<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64" shape-rendering="crispEdges">
  <!-- Kursi berada di belakang meja sehingga workstation terbaca sebagai satu object. -->
  <rect x="4" y="57" width="116" height="3" fill="#050b14" opacity=".7"/>
  <rect x="8" y="25" width="20" height="22" fill="#7c3aed"/>
  <rect x="5" y="43" width="27" height="8" fill="#6d28d9"/>
  <rect x="15" y="50" width="6" height="9" fill="#475569"/>
  <rect x="7" y="59" width="22" height="2" fill="#64748b"/>

  <!-- Lampu meja menempel di sisi kiri meja. -->
  <rect x="31" y="12" width="4" height="27" fill="#facc15"/>
  <rect x="24" y="8" width="18" height="6" fill="#fde68a"/>
  <rect x="27" y="14" width="12" height="3" fill="#facc15"/>
  <rect x="27" y="38" width="13" height="3" fill="#64748b"/>

  <!-- Monitor dan stand berada tepat di atas meja. -->
  <rect x="47" y="5" width="34" height="25" fill="#334155"/>
  <rect x="51" y="9" width="26" height="17" fill="#0b1728"/>
  <rect x="55" y="12" width="10" height="2" fill="#38bdf8"/>
  <rect x="55" y="17" width="17" height="2" fill="#4ade80"/>
  <rect x="55" y="22" width="8" height="2" fill="#c084fc"/>
  <rect x="61" y="30" width="7" height="8" fill="#475569"/>
  <rect x="53" y="37" width="23" height="3" fill="#64748b"/>

  <!-- Meja, keyboard, dan CPU saling berbagi garis dasar yang sama. -->
  <rect x="27" y="40" width="75" height="6" fill="#8b5e3c"/>
  <rect x="31" y="46" width="5" height="16" fill="#5b3a29"/>
  <rect x="92" y="46" width="5" height="16" fill="#5b3a29"/>
  <rect x="37" y="47" width="55" height="3" fill="#b8794b"/>
  <rect x="54" y="42" width="25" height="5" fill="#64748b"/>
  <rect x="58" y="43" width="17" height="2" fill="#cbd5e1"/>

  <!-- CPU berada di bawah sisi kanan meja, menyatu dengan kabel monitor. -->
  <rect x="103" y="32" width="21" height="30" fill="#475569"/>
  <rect x="107" y="36" width="13" height="11" fill="#0b1728"/>
  <rect x="110" y="39" width="7" height="3" fill="#4ade80"/>
  <rect x="107" y="51" width="3" height="3" fill="#38bdf8"/>
  <rect x="113" y="51" width="3" height="3" fill="#facc15"/>
  <rect x="119" y="51" width="3" height="3" fill="#f87171"/>
  <rect x="81" y="28" width="2" height="12" fill="#28425e"/>
</svg>
